<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TeaChoice - 今日の一杯をランダムに</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#ffffff">
  <style>
    :root{--pad:12px;--radius:10px;--shadow:0 2px 12px rgba(0,0,0,.08);}
    body{margin:0;background:#f7f8fa;color:#111;font-family:system-ui,Roboto,"Noto Sans JP",sans-serif;}
    header{position:sticky;top:0;background:#fff;padding:10px var(--pad);box-shadow:var(--shadow);z-index:2;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    header h1{font-size:18px;margin:0;flex:1}
    button,select,input,textarea{font-size:16px}
    .btn{padding:10px 14px;border-radius:8px;border:1px solid #d0d6e0;background:#fff;cursor:pointer}
    .btn.primary{background:#111;color:#fff;border-color:#111}
    .btn.danger{background:#fff;color:#b00020;border-color:#b00020}
    .wrap{padding:var(--pad);max-width:1000px;margin:0 auto}
    .card{background:#fff;border:1px solid #e4e7ee;border-radius:var(--radius);padding:var(--pad);box-shadow:var(--shadow);margin-bottom:12px}
    .tabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
    .tab{padding:8px 12px;border-radius:999px;border:1px solid #d0d6e0;background:#fff;cursor:pointer}
    .tab.active{background:#111;color:#fff;border-color:#111}
    .subtabs{display:flex;gap:6px;margin:8px 0}
    .subtab{padding:6px 10px;border-radius:999px;border:1px solid #ccc;background:#fff;cursor:pointer;font-size:13px}
    .subtab.active{background:#2b2f36;color:#fff;border-color:#2b2f36}
    table{width:100%;border-collapse:collapse}
    th,td{border-bottom:1px solid #eef1f6;padding:6px;text-align:left;font-size:14px}
    th{background:#fafbfc;position:sticky;top:0;z-index:1}
    .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef4ff;border:1px solid #cfe0ff;font-size:12px}
    .toast{position:fixed;bottom:20px;right:20px;background:#111;color:#fff;padding:8px 12px;border-radius:6px;opacity:0;transition:opacity 0.3s;z-index:999}
    .toast.show{opacity:1}
    .fab{position:fixed;bottom:20px;right:20px;background:#111;color:#fff;border:none;border-radius:50%;width:56px;height:56px;font-size:24px;box-shadow:var(--shadow);cursor:pointer;display:none}
    @media(max-width:768px){.fab{display:block}}
  </style>
</head>
<body>
<header>
  <h1>TeaChoice</h1>
  <button id="btnDraw" class="btn primary">抽選する</button>
</header>

<div class="wrap">

  <div class="tabs">
    <button class="tab active" data-tab="draw">抽選</button>
    <button class="tab" data-tab="table">茶葉リスト</button>
    <button class="tab" data-tab="history">履歴</button>
    <button class="tab" data-tab="settings">設定</button>
  </div>

  <!-- 抽選 -->
  <section id="tab-draw" class="card">
    <div class="controls">
      <label>種類(産地)
        <select id="fType"></select>
      </label>
      <label>カフェイン
        <select id="fCaf">
          <option value="">すべて</option>
          <option value="有">有</option>
          <option value="無">無</option>
        </select>
      </label>
      <label>フリーワード
        <input id="fKeyword" placeholder="商品名・種類・メモで検索">
      </label>
    </div>
    <hr />
    <div id="drawResult">まだ抽選していません。</div>
  </section>

  <!-- 茶葉 -->
  <section id="tab-table" class="card" style="display:none">
    <div style="overflow:auto;max-height:60vh">
      <table id="teaTable">
        <thead>
          <tr>
            <th>商品名</th><th>ブランド</th><th>種類(産地)</th><th>カフェイン</th>
            <th>在庫</th><th>賞味期限</th><th>基本重み</th><th>抽選対象</th><th>メモ</th>
          </tr>
        </thead>
        <tbody>
          <!-- 初期5行 -->
          <tr><td contenteditable></td><td contenteditable></td><td contenteditable></td><td contenteditable></td><td><select><option>あり</option><option>なし</option></select></td><td><input type="date"></td><td contenteditable>1</td><td><input type="checkbox" checked></td><td contenteditable></td></tr>
          <tr><td contenteditable></td><td contenteditable></td><td contenteditable></td><td contenteditable></td><td><select><option>あり</option><option>なし</option></select></td><td><input type="date"></td><td contenteditable>1</td><td><input type="checkbox" checked></td><td contenteditable></td></tr>
          <tr><td contenteditable></td><td contenteditable></td><td contenteditable></td><td contenteditable></td><td><select><option>あり</option><option>なし</option></select></td><td><input type="date"></td><td contenteditable>1</td><td><input type="checkbox" checked></td><td contenteditable></td></tr>
          <tr><td contenteditable></td><td contenteditable></td><td contenteditable></td><td contenteditable></td><td><select><option>あり</option><option>なし</option></select></td><td><input type="date"></td><td contenteditable>1</td><td><input type="checkbox" checked></td><td contenteditable></td></tr>
          <tr><td contenteditable></td><td contenteditable></td><td contenteditable></td><td contenteditable></td><td><select><option>あり</option><option>なし</option></select></td><td><input type="date"></td><td contenteditable>1</td><td><input type="checkbox" checked></td><td contenteditable></td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <!-- 履歴 -->
  <section id="tab-history" class="card" style="display:none">
    <button id="btnExportHistory" class="btn">履歴CSV保存</button>
    <table id="histTable"><thead><tr><th>日時</th><th>商品名</th><th>ブランド</th><th>種類</th><th>賞味期限</th><th>メモ</th></tr></thead><tbody></tbody></table>
  </section>

  <!-- 設定 -->
  <section id="tab-settings" class="card" style="display:none">
    <div class="subtabs">
      <button class="subtab active" data-sub="simple">簡単設定</button>
      <button class="subtab" data-sub="advanced">上級設定</button>
    </div>

    <div id="sub-simple">
      <label>抽選モード
        <select id="mode">
          <option value="random">ランダム（等確率）</option>
          <option value="recommended" selected>おすすめ（期限優先・軽め）</option>
          <option value="custom">カスタム</option>
        </select>
      </label>
      <hr>
      <button id="btnClearHist" class="btn danger">履歴と重み設定を初期化</button>
    </div>

    <div id="sub-advanced" style="display:none">
      <p><b>D（日）</b>：期限が近いほど重くする効果が立ち上がる範囲（例: D=60 → 残30日で半分、0日で最大）</p>
      <p><b>K（強調係数）</b>：期限が近い時の増やし方（例: K=2 → 最大3倍）</p>
      <p><b>recentN</b>：直近N回の当選銘柄を出にくくする回数</p>
      <p><b>biasFactor</b>：その下げ幅（例:0.5で半分）</p>
      <p><b>基本重み</b>：銘柄ごとの基礎確率（1=標準,2=出やすい,0.5=出にくい）</p>
    </div>
  </section>
</div>

<button id="fab" class="fab">🎲</button>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
// --- 簡易実装（データはlocalStorage, 抽選ロジック省略の雛形） ---
const $ = s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2000);}

let isDrawing=false;
function setBtnLabel(label){$("#btnDraw").textContent=label;$("#fab").textContent=(label==="抽選する"?"🎲":"🔄");}

$("#btnDraw").addEventListener("click",()=>{ if(isDrawing) return; isDrawing=true; setTimeout(()=>{isDrawing=false},400); setBtnLabel("再抽選"); $("#drawResult").textContent="サンプル: アッサム"; });
$("#fab").addEventListener("click",()=>$("#btnDraw").click());
$("#btnExportHistory").addEventListener("click",()=>{ if(confirm("履歴CSVを保存しますか？")) toast("保存しました");});
$("#btnClearHist").addEventListener("click",()=>{ if(confirm("履歴と重み設定を初期化します。よろしいですか？")) toast("初期化しました");});

// タブ
$$(".tab").forEach(b=>b.addEventListener("click",()=>{ $$(".tab").forEach(t=>t.classList.remove("active")); b.classList.add("active"); ["draw","table","history","settings"].forEach(id=>$("#tab-"+id).style.display=(b.dataset.tab===id)?"block":"none"); }));
// サブタブ
$$(".subtab").forEach(b=>b.addEventListener("click",()=>{ $$(".subtab").forEach(t=>t.classList.remove("active")); b.classList.add("active"); $("#sub-simple").style.display=(b.dataset.sub==="simple")?"block":"none"; $("#sub-advanced").style.display=(b.dataset.sub==="advanced")?"block":"none"; }));
</script>
</body>
</html>
