<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>紅茶抽選（シンプル版・ローカル保存）</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#ffffff">
  <style>
    :root{--pad:12px;--radius:10px;--gap:10px;--shadow:0 2px 12px rgba(0,0,0,.08)}
    *{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Noto Sans JP","Apple Color Emoji","Segoe UI Emoji","Noto Sans JP";}
    body{margin:0;background:#f7f8fa;color:#111}
    header{position:sticky;top:0;background:#fff;padding:10px var(--pad);box-shadow:var(--shadow);z-index:2;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    header h1{font-size:18px;margin:0;flex:1}
    button,select,input,textarea{font-size:16px}
    .btn{padding:10px 14px;border-radius:8px;border:1px solid #d0d6e0;background:#fff;cursor:pointer}
    .btn.primary{background:#111;color:#fff;border-color:#111}
    .wrap{padding:var(--pad);max-width:1000px;margin:0 auto}
    .card{background:#fff;border:1px solid #e4e7ee;border-radius:var(--radius);padding:var(--pad);box-shadow:var(--shadow);margin-bottom:12px}
    .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
    .tab{padding:8px 12px;border-radius:999px;border:1px solid #d0d6e0;background:#fff;cursor:pointer}
    .tab.active{background:#111;color:#fff;border-color:#111}
    .subtabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
    .subtab{padding:6px 10px;border-radius:999px;border:1px solid #e0e3ea;background:#fff;cursor:pointer;font-size:13px}
    .subtab.active{background:#2b2f36;color:#fff;border-color:#2b2f36}
    table{width:100%;border-collapse:collapse}
    th,td{border-bottom:1px solid #eef1f6;padding:8px;text-align:left}
    th{position:sticky;top:0;background:#fafbfc;z-index:1}
    tr:hover td{background:#fafcfe}
    .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef4ff;border:1px solid #cfe0ff;font-size:12px}
    .kpi{font-size:14px;opacity:.75}
    .muted{opacity:.75}
    .textarea{width:100%;min-height:70px}
    .footer{padding:20px;text-align:center;color:#666}
    .danger{color:#b00020}
  </style>
</head>
<body>
<header>
  <h1>紅茶抽選（シンプル版・ローカル保存）</h1>
  <button id="btnDraw" class="btn primary">1件 抽選する</button>
  <span id="today" class="kpi"></span>
</header>

<div class="wrap">

  <div class="tabs">
    <button class="tab active" data-tab="draw">抽選</button>
    <button class="tab" data-tab="table">茶葉</button>
    <button class="tab" data-tab="history">履歴</button>
    <button class="tab" data-tab="settings">設定</button>
  </div>

  <!-- 抽選 -->
  <section id="tab-draw" class="card">
    <div class="controls">
      <label>Type
        <select id="fType" multiple size="1"></select>
      </label>
      <label>Caffeine
        <select id="fCaf">
          <option value="">指定なし</option>
          <option value="有">有</option>
          <option value="無">無</option>
